# Продакшен: postgres + backend + nginx (лендинг + прокси API)
#
# 1. cp .env.production.example .env.production
# 2. Заполните секреты в .env.production
# 3. Положите APK в landing/downloads/orenplace.apk
# 4. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: orenplace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orenplace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orenplace-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orenplace}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orenplace-backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orenplace}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - orenplace-network

  nginx:
    image: nginx:alpine
    container_name: orenplace-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./landing:/usr/share/nginx/html/landing:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - orenplace-network

volumes:
  postgres_data:
  uploads_data:

networks:
  orenplace-network:
    driver: bridge
