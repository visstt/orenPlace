# Подключение после setup-ssl.sh:
# docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml ...

services:
  nginx:
    ports:
      - '${HTTP_PORT:-80}:80'
      - '443:443'
    volumes:
      - ./landing:/usr/share/nginx/html/landing:ro
      - ./nginx/default.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
